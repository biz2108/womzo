name: Publish Development Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pre-publication tests
    if: github.repository == 'biz2108/sjb-world-webcams' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run automated tests
        run: bash tests/run_tests.sh

  publish:
    name: Build and publish Docker images
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish development image
        run: |
          VERSION="$(cat VERSION)"
          IMAGE="ghcr.io/biz2108/sjb-world-webcams"
          TAG="dev-${GITHUB_SHA}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$TAG" \
            --push .

          docker buildx imagetools inspect "$IMAGE:$TAG"

      - name: Log out of registry
        if: always()
        run: docker logout ghcr.io
