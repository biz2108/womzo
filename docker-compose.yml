
services:
  webcam-directory:
    build: .
    container_name: webcam-directory
    restart: unless-stopped

    user: "${PUID:-1000}:${PGID:-1000}"

    # Restrict container privileges
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Temporary writable space for Gunicorn
    tmpfs:
      - /tmp:rw,size=64m,mode=1777

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8099:8000"

    env_file:
      - .env

    environment:
      DB_PATH: /data/webcams.sqlite3

    volumes:
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
